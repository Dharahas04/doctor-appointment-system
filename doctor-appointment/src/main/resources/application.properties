spring.application.name=doctor-appointment
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/doctor_db
spring.datasource.username=root
spring.datasource.password=Sai@4205

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.data.redis.repositories.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
spring.redis.host=localhost
spring.redis.port=6379
spring.mail.host=${APP_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${APP_MAIL_PORT:587}
spring.mail.username=${APP_MAIL_USERNAME:}
spring.mail.password=${APP_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${APP_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${APP_MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${APP_MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${APP_MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${APP_MAIL_WRITE_TIMEOUT:5000}

app.security.jwt.secret=${APP_JWT_SECRET:doctor-appointment-demo-jwt-secret-please-change}
app.security.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:720}
app.bootstrap.admin.email=${APP_ADMIN_EMAIL:dharahas04@gmail.com}
app.bootstrap.admin.password=${APP_ADMIN_PASSWORD:12345678}
app.bootstrap.admin.full-name=${APP_ADMIN_FULL_NAME:Dharahas Admin}
app.notification.email.enabled=${APP_NOTIFICATION_EMAIL_ENABLED:true}
app.notification.from-email=${APP_NOTIFICATION_FROM_EMAIL:${APP_MAIL_USERNAME:no-reply@pulsepoint.local}}
